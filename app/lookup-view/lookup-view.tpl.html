<div layout="column" layout-align="space-around start" layout-margin>


    <div>
        Please enter a hanzi character and press ENTER
        <form ng-submit="lookup()">

            <input type="text" ng-model="input.hanzi"/>
            <md-button class="md-raised" type="submit"> Search</md-button>
        </form>

    </div>


    <div ng-if="output.result">

        <div style="font-size: 36px; font-weight: bold; margin-bottom: 8px;"> {{output.result.character}}</div>
        <div ng-if="output.result.meaning && output.result.meaning[0]"> Meaning: {{output.result.meaning[0]}}
        </div>

        <div ng-if="output.result.pinyin && output.result.pinyin[0]"> Pinyin: {{output.result.pinyin[0]}}
        </div>

        <div style="margin-top: 10px;">

            <strong>Wubi 06 Code:</strong>
            <ul>
                <li ng-repeat="code in output.result.wubiCode" class="lookup-wubi" style="font-size: 20px; font-family: monospace;">
                    {{code}}
                </li>
            </ul>

        </div>

    </div>
</div>
